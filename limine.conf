# Timeout in seconds. Zero boots immediately into audiOS.
timeout: 0

/audiOS
    protocol: limine
    path: boot():/boot/kernel
    # Ask for a large mode. Limine picks the closest the GPU/VBIOS has
    # (onboard VGA or a GTX 1050), and the kernel sizes the text grid
    # from the framebuffer it actually gets.
    resolution: 1920x1080x32
    module_path: boot():/audio/test.wav
    module_path: boot():/audio/bad.wav
    module_path: boot():/audio/float.wav

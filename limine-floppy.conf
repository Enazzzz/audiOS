# Floppy-only Limine config. The kernel lives on this disk so an old BIOS
# that cannot boot USB-HDD still reaches audiOS. USB (label AUDIOS) is C:/D:
# once the kernel is running.
#
# `fslabel(AOSBOOT)` is the FAT12 volume on this floppy. Limine stage 2 does
# not scan BIOS drive 00h; the INT13 shim aliases the floppy as 0xEF so the
# label is visible. `boot():` is a fallback if the BIOS already passed 0x80.
timeout: 3
serial: yes
serial_baudrate: 115200

/audiOS
    comment: kernel on this floppy
    protocol: limine
    path: fslabel(AOSBOOT):/boot/kernel
    resolution: 1920x1080x32

/audiOS (boot volume)
    comment: if the BIOS presented the floppy as 80h
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1920x1080x32

/audiOS from USB (label AUDIOS)
    comment: if this floppy's kernel is stale; needs BIOS USB-HDD
    protocol: limine
    path: fslabel(AUDIOS):/boot/kernel
    resolution: 1920x1080x32
    module_path: fslabel(AUDIOS):/audio/test.wav
    module_path: fslabel(AUDIOS):/audio/bad.wav
    module_path: fslabel(AUDIOS):/audio/float.wav

/Chainload HDD 0
    comment: BIOS 80h MBR (internal disk)
    protocol: bios
    drive: 1
    partition: 0

/Chainload HDD 1
    comment: BIOS 81h MBR (often a USB stick)
    protocol: bios
    drive: 2
    partition: 0

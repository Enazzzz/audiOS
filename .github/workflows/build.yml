name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc make xorriso qemu-system-x86 mtools python3 curl git
      - name: Build ISO and smoke-test in QEMU
        run: make test
      - name: Checksums
        run: |
          sha256sum audios.img audios.iso | tee SHA256SUMS
          gzip -9 -k -f audios.img
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audios-images
          path: |
            audios.img
            audios.img.gz
            audios.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      # Every branch push gets its own downloadable release (agent work included).
      - name: Publish GitHub Release (this build)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: audios.img ${{ github.ref_name }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Prebuilt disks from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Flash **`audios.img`** (or decompress `audios.img.gz` first) as a raw USB image on the ASRock 960GM-GS3 FX. Do not flash `audios.iso` on that board.

            USB keyboard (rear USB 2.0) or PS/2. Etcher raw / Rufus DD / `dd`.
          files: |
            audios.img
            audios.img.gz
            audios.iso
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Rolling pointer: always the last green `main` build.
      - name: Publish GitHub Release (latest / main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: audiOS images
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Prebuilt disks from `${{ github.sha }}` (main).

            Flash **`audios.img`** (or decompress `audios.img.gz` first) as a raw USB image on the ASRock 960GM-GS3 FX. Do not flash `audios.iso` on that board.

            USB keyboard (rear USB 2.0) or PS/2. Etcher raw / Rufus DD / `dd`.
          files: |
            audios.img
            audios.img.gz
            audios.iso
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

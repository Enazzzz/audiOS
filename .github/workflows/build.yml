name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc make gcc-multilib xorriso qemu-system-x86 mtools python3 curl git nasm
      - name: Build ISO and smoke-test in QEMU
        run: make test
      - name: Checksums
        run: |
          sha256sum audios.img audios.iso audios.flp audios32.flp audios32.hdd | tee SHA256SUMS
          gzip -9 -k -f audios.img
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audios-images
          path: |
            audios.img
            audios.img.gz
            audios.iso
            audios.flp
            audios32.flp
            audios32.hdd
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      # Every branch push gets its own downloadable release (agent work included).
      - name: Publish GitHub Release (this build)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: audios.img ${{ github.ref_name }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Prebuilt disks from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Flash **`audios.img`** (or decompress `audios.img.gz` first) as a raw USB image on the ASRock 960GM-GS3 FX (x86-64 **master**). Do not flash `audios.iso` on that board.

            ASUS A7V333 (32-bit Athlon XP): boot **`audios32.hdd`** on IDE, or write **`audios32.flp`** to a 1.44 MB floppy. From the FX master, plug that disk into the PATA header and run `ide format`. Cable: each machine line-out → the other line-in. `link on` on the FX (master); the A7V333 listens as slave.

            A 64-bit BIOS box that cannot boot USB can still use **`audios.flp`** (Limine, needs long mode). Keep the USB stick plugged in for C:/D: on the FX.

            PS/2 keyboard. Etcher raw / Rufus DD / `dd`.
          files: |
            audios.img
            audios.img.gz
            audios.iso
            audios.flp
            audios32.flp
            audios32.hdd
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Rolling pointer: always the last green `main` build.
      - name: Publish GitHub Release (latest / main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: audiOS images
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Prebuilt disks from `${{ github.sha }}` (main).

            Flash **`audios.img`** (or decompress `audios.img.gz` first) as a raw USB image on the ASRock 960GM-GS3 FX (x86-64 **master**). Do not flash `audios.iso` on that board.

            ASUS A7V333 (32-bit Athlon XP): boot **`audios32.hdd`** on IDE, or write **`audios32.flp`** to a 1.44 MB floppy. From the FX, `ide format` installs the slave OS onto a PATA disk. Cable: each machine line-out → the other line-in.

            A 64-bit BIOS box that cannot boot USB can still use **`audios.flp`**. Keep the USB stick plugged in for C:/D: on the FX.

            PS/2 keyboard. Etcher raw / Rufus DD / `dd`.
          files: |
            audios.img
            audios.img.gz
            audios.iso
            audios.flp
            audios32.flp
            audios32.hdd
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
